<vbox id="cc-prefs">
	<groupbox>
		<label><html:h2>Columns, options and themes</html:h2></label>
		<html:p style="max-width: 46em; line-height: 1.5;">
			Create checkbox, rating, link, text and option columns, choose their colors,
			and pick a theme in the Custom Columns settings window.
			To show a column, right-click any item-list column header and tick it.
		</html:p>
		<hbox>
			<button id="cc-open-settings" label="Open Custom Columns settings…"
				oncommand="Zotero.CustomColumns.openSettings()"/>
		</hbox>
	</groupbox>
</vbox>
